<text x="19.2" y="307.6" font-size="14" font-weight="bold" fill="#3a3226" text-anchor="start">SA1：分水口（a1を配る）</text>
<text x="19.2" y="325.6" font-size="12" font-weight="normal" fill="#3a3226" text-anchor="start">a1 の水は、2つの桝の両方で</text>
<text x="19.2" y="343.6" font-size="12" font-weight="normal" fill="#3a3226" text-anchor="start">b を待つ必要がある</text>
<text x="19.2" y="361.6" font-size="12" font-weight="normal" fill="#3a3226" text-anchor="start">（a1かつb1 と a1かつb0）</text>
<text x="19.2" y="379.6" font-size="12" font-weight="normal" fill="#3a3226" text-anchor="start">水は分けると減るので、</text>
<text x="19.2" y="397.6" font-size="12" font-weight="normal" fill="#3a3226" text-anchor="start">最初に 2u 注いで、</text>
<text x="19.2" y="415.6" font-size="12" font-weight="normal" fill="#3a3226" text-anchor="start">仕切りで 1u ずつ2本に分ける</text>
<text x="19.2" y="433.6" font-size="12" font-weight="normal" fill="#3a3226" text-anchor="start">（円筒分水などが使える）</text>
